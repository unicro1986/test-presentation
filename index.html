<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тестовая презентация</title>
<style>
  :root { --bg:#141414; --fg:#f2f2f2; --muted:#9a9a9a; --accent:#e8873a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow:hidden; }
  .slide { position:absolute; inset:0; display:flex; flex-direction:column;
    padding:32px 48px 72px; opacity:0; visibility:hidden; transition:opacity .4s; }
  .slide.active { opacity:1; visibility:visible; }
  .slide h1 { font-size:clamp(22px,3.2vw,40px); font-weight:600; margin-bottom:6px; }
  .slide p.sub { color:var(--muted); font-size:clamp(14px,1.4vw,18px); margin-bottom:20px; }
  .stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .stage img { max-width:100%; max-height:100%; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .stage iframe { width:100%; height:100%; border:0; border-radius:12px; background:#222; }
  nav { position:fixed; left:0; right:0; bottom:0; height:56px; display:flex;
    align-items:center; justify-content:center; gap:16px; z-index:10; }
  nav button { background:#2a2a2a; color:var(--fg); border:1px solid #3a3a3a; border-radius:8px;
    width:44px; height:36px; font-size:18px; cursor:pointer; }
  nav button:hover { border-color:var(--accent); }
  nav button:disabled { opacity:.35; cursor:default; }
  #counter { color:var(--muted); font-variant-numeric:tabular-nums; min-width:48px; text-align:center; }
  @media (max-width:600px){ .slide { padding:20px 16px 64px; } }
</style>
</head>
<body>

<section class="slide active">
  <h1>Слайд 1. Кот</h1>
  <p class="sub">Изображение сгенерировано в Codex (ChatGPT image_gen)</p>
  <div class="stage"><img src="cat.png" alt="Рыжий кот на подоконнике"></div>
</section>

<section class="slide">
  <h1>Слайд 2. 3D-модель из Sketchfab</h1>
  <p class="sub">Тестовый куб, загруженный автоматически через папку Inbox. Модель можно вращать мышью.</p>
  <div class="stage">
    <iframe title="Тестовый куб" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      data-src="https://sketchfab.com/models/13c5259f0c3f441090038e30939e7e50/embed?autostart=1&ui_infos=0&ui_watermark=0"></iframe>
  </div>
</section>

<nav>
  <button id="prev" aria-label="Назад">&#8592;</button>
  <span id="counter"></span>
  <button id="next" aria-label="Вперёд">&#8594;</button>
</nav>

<script>
  const slides = [...document.querySelectorAll('.slide')];
  let i = 0;
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('active', k === i));
    const f = slides[i].querySelector('iframe[data-src]');
    if (f && !f.src) f.src = f.dataset.src;   // load the 3D viewer only when its slide opens
    document.getElementById('counter').textContent = (i + 1) + ' / ' + slides.length;
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === slides.length - 1;
  }
  document.getElementById('prev').onclick = () => show(i - 1);
  document.getElementById('next').onclick = () => show(i + 1);
  document.addEventListener('keydown', e => {
    if (['ArrowRight','PageDown',' '].includes(e.key)) show(i + 1);
    if (['ArrowLeft','PageUp'].includes(e.key)) show(i - 1);
  });
  show(0);
</script>
</body>
</html>
